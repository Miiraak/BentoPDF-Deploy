name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell and Compose validation
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          shellcheck scripts/*.sh tests/*.sh
          docker compose config --quiet
      - name: Workflow validation
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.12 -color
      - name: Script and NGINX regression tests
        run: |
          bash tests/fetch-wasm.sh
          docker build --target runtime-base -t bentopdf:runtime-ci .
          bash tests/runtime.sh bentopdf:runtime-ci

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Prepare WASM and license references
        run: |
          ./scripts/fetch-wasm.sh
          ./scripts/show-licenses.sh
      - name: Read build arguments from Compose
        run: |
          docker compose config --format json \
            | node -e 'const c=JSON.parse(require("fs").readFileSync(0,"utf8")); for (const [k,v] of Object.entries(c.services.bentopdf.build.args)) console.log(k+"="+v);' \
            > "$RUNNER_TEMP/build-args"
          {
            echo 'BUILD_ARGS<<EOF'
            cat "$RUNNER_TEMP/build-args"
            echo EOF
          } >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: bentopdf:ci
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Runtime regression tests
        run: bash tests/smoke.sh bentopdf:ci
      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: image
          version: v0.76.2
          image-ref: bentopdf:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
